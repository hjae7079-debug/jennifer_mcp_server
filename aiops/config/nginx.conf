map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 18080 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_tokens off;
    client_max_body_size 20m;

    auth_basic "AIOps Dashboard";
    auth_basic_user_file /etc/nginx/certs/htpasswd;

    # 허용 경로만 API로 전달 (나머지 /api/* 는 404)
    location ~ ^/api/(dashboard|items/|integrations/status)(.*)$ {
        proxy_pass http://api:8000/$1$2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }
    location /api/ {
        return 404;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 18081 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_tokens off;
    client_max_body_size 50m;

    # Open WebUI 자체 로그인 사용 (사용자 채팅 경로는 Open WebUI가 처리)
    location / {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
